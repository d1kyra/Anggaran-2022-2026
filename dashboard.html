<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard APBD dan APBN</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-menu { transition: all 0.25s ease; cursor: pointer; border: none; }
        .card-menu:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15)!important; }
        .btn-toggle-source { width: 140px; font-weight: 600; }
        .table-excel th { vertical-align: middle; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="fa fa-chart-pie text-success me-2"></i> Anggaran Tahunan </span>
        <a href="index.html" class="btn btn-danger">
            <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Keluar
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark m-0">Anggaran 2022-2026</h3>
            <small class="text-muted">Dinas Pangan, Tanaman Pangan & Hortikultura Prov. Kaltim</small>
        </div>
        
        <div class="bg-white p-1 rounded-3 shadow-sm border mt-3 mt-sm-0">
            <button id="btnAPBD" class="btn btn-toggle-source btn-primary rounded-2 py-2" onclick="showTabAPBD()">
                <i class="fa-solid fa-building-government me-2"></i> APBD
            </button>
            <button id="btnAPBN" class="btn btn-toggle-source btn-light rounded-2 py-2 text-muted" onclick="showTabAPBN()">
                <i class="fa-solid fa-landmark me-2"></i> APBN
            </button>
        </div>
    </div>
    
    <div class="d-flex justify-content-between align-items-end mb-3">
        <h5 class="fw-bold text-secondary m-0" id="mainTitle"><i class="fa-solid fa-list-check me-2"></i> Daftar Unit Kerja / Kegiatan</h5>
        
        <div id="filterTahunAPBN" class="d-none">
            <label class="fw-bold small text-muted me-2">Tahun:</label>
            <select id="tahunApbn" class="form-select form-select-sm w-auto d-inline-block border-secondary shadow-sm" onchange="renderTableAPBN()">
                <option value="2026" selected>2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
            </select>
        </div>
    </div>

    <!-- TAMPILAN 1: KARTU APBD -->
    <div class="row g-3 mb-5" id="menuContainer"></div>

    <!-- TAMPILAN 2: TABEL APBN DINAMIS -->
    <div id="apbnContainer" class="d-none mb-5">
        <div class="bg-white p-3 rounded-3 shadow-sm border table-responsive">
            <table class="table table-bordered table-hover table-excel mb-0 small">
                <!-- Judul Kolom (thead) akan dibuat dinamis oleh Javascript -->
                <thead id="apbnTableHead" class="table-dark text-center"></thead>
                <tbody id="apbnTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL MATRIKS (KHUSUS APBD) -->
<div class="modal fade" id="matrixModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content shadow-lg border-0 rounded-3">
            <div class="modal-header bg-dark text-white py-3">
                <h5 class="modal-title fw-bold" id="modalTitle">Matriks Multiyears</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle mb-0 text-center">
                        <thead class="table-dark small text-uppercase">
                            <tr>
                                <th style="width: 25%;">Komponen Anggaran</th>
                                <th>2022</th>
                                <th>2023</th>
                                <th>2024</th>
                                <th>2025</th>
                                <th>2026 (s.d Juni)</th>
                                <th class="bg-primary text-white">Total Keseluruhan</th>
                            </tr>
                        </thead>
                        <tbody id="matrixTableBody" class="small"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="database.js"></script>
<script src="database2.js"></script>

<script>
let currentModeTitle = "APBD";
let currentDataSource = {}; 

function showTabAPBD() {
    currentModeTitle = "APBD";
    document.getElementById('btnAPBD').className = "btn btn-toggle-source btn-primary rounded-2 py-2";
    document.getElementById('btnAPBN').className = "btn btn-toggle-source btn-light rounded-2 py-2 text-muted";
    
    document.getElementById('menuContainer').classList.remove('d-none');
    document.getElementById('apbnContainer').classList.add('d-none');
    document.getElementById('filterTahunAPBN').classList.add('d-none');
    document.getElementById('mainTitle').innerHTML = '<i class="fa-solid fa-list-check me-2"></i> Daftar Unit Kerja / Kegiatan';

    currentDataSource = typeof dataAPBD !== 'undefined' ? dataAPBD : {};
    renderMenuCards();
}

function showTabAPBN() {
    currentModeTitle = "APBN";
    document.getElementById('btnAPBD').className = "btn btn-toggle-source btn-light rounded-2 py-2 text-muted";
    document.getElementById('btnAPBN').className = "btn btn-toggle-source btn-primary rounded-2 py-2";
    
    document.getElementById('menuContainer').classList.add('d-none');
    document.getElementById('apbnContainer').classList.remove('d-none');
    document.getElementById('filterTahunAPBN').classList.remove('d-none');
    document.getElementById('mainTitle').innerHTML = '<i class="fa-solid fa-table me-2"></i> Realisasi Anggaran APBN';

    renderTableAPBN();
}

function renderMenuCards() {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';
    
    Object.keys(currentDataSource).forEach(key => {
        const item = currentDataSource[key];
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        
        col.innerHTML = `
            <div class="card card-menu h-100 border-start border-4 border-primary shadow-sm" onclick="openUnitMatrix('${key}')">
                <div class="card-body py-3 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-secondary opacity-75 small">Kode: ${key}</span>
                            <span class="badge bg-light text-dark border small">${currentModeTitle}</span>
                        </div>
                        <h6 class="fw-bold text-dark mb-1">${item.nama}</h6>
                    </div>
                    <div class="text-end mt-2">
                        <small class="text-primary fw-semibold">Lihat Matriks <i class="fa fa-arrow-right ms-1"></i></small>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(col);
    });
}

function renderTableAPBN() {
    const tahunPilihan = document.getElementById('tahunApbn').value;
    const thead = document.getElementById('apbnTableHead');
    const tbody = document.getElementById('apbnTableBody');
    
    thead.innerHTML = '';
    tbody.innerHTML = '';

    // LOGIKA PERUBAHAN KOLOM OTOMATIS BERDASARKAN TAHUN
    let judulPagu = "";
    if (tahunPilihan === "2026") {
        judulPagu = `
            <th rowspan="2">Pagu DIPA</th>
            <th rowspan="2">Pagu Revisi</th>
            <th rowspan="2">Pagu 2026</th>`;
    } else if (tahunPilihan === "2024") {
        judulPagu = `
            <th rowspan="2">Pagu Murni</th>
            <th rowspan="2" class="bg-secondary">Pagu APBN Rev 2024</th>
            <th rowspan="2">Pagu Anggaran Revisi</th>`;
    } else if (tahunPilihan === "2025") {
        judulPagu = `
            <th rowspan="2">Pagu DIPA</th>
            <th rowspan="2" class="bg-secondary">Pagu Blokir</th>
            <th rowspan="2">Pagu Setelah Blokir</th>`;
    } else {
        judulPagu = `
            <th rowspan="2">Pagu Anggaran</th>
            <th rowspan="2">Pagu Anggaran Revisi</th>`;
    }

    thead.innerHTML = `
        <tr>
            <th rowspan="2" style="width:50px;">No</th>
            <th rowspan="2">Kode Satker</th>
            <th rowspan="2">Nama Kegiatan</th>
            <th rowspan="2">DK/TP</th>
            ${judulPagu}
            <th colspan="2">Realisasi</th>
            <th rowspan="2">Sisa</th>
        </tr>
        <tr>
            <th>Keuangan (Rp)</th>
            <th>%</th>
        </tr>
    `;

    if (typeof dataAPBN === 'undefined' || !dataAPBN[tahunPilihan]) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-muted fw-bold">Data Tahun ${tahunPilihan} belum tersedia.</td></tr>`;
        return;
    }

    const dataTahunIni = dataAPBN[tahunPilihan];
    
    // Objek untuk menyimpan rekapitulasi nilai
    let sumDK = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, sisa: 0 };
    let sumTP = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, sisa: 0 };
    let sumTotal = { paguDipa: 0, paguRev2024: 0, paguBlokir: 0, paguRevisi: 0, paguSetelahBlokir: 0, realisasiRp: 0, sisa: 0 };

    dataTahunIni.forEach((item, index) => {
        const tr = document.createElement('tr');
        
        const pDipa = item.paguDipa || 0;
        const pRev24 = item.paguRev2024 || 0;
        const pBlokir = item.paguBlokir || 0;
        const pRevisi = item.paguRevisi || 0;
        const pSetelahBlokir = item.paguSetelahBlokir || 0;
        const realRp = item.realisasiRp || 0;
        const sisa = item.sisaAnggaran || 0;

        let isiKolomPagu = "";
        if (tahunPilihan === "2026") {
            isiKolomPagu = `
                <td class="text-end">${formatRupiah(pDipa)}</td>
                <td class="text-end fw-semibold text-danger">${formatRupiah(pRevisi)}</td>
                <td class="text-end text-primary">${formatRupiah(pSetelahBlokir)}</td>`;
        } else if (tahunPilihan === "2024") {
            isiKolomPagu = `
                <td class="text-end">${formatRupiah(pDipa)}</td>
                <td class="text-end fw-semibold">${formatRupiah(pRev24)}</td>
                <td class="text-end text-primary">${formatRupiah(pSetelahBlokir)}</td>`;
        } else if (tahunPilihan === "2025") {
            isiKolomPagu = `
                <td class="text-end">${formatRupiah(pDipa)}</td>
                <td class="text-end fw-semibold text-danger">${formatRupiah(pBlokir)}</td>
                <td class="text-end text-primary">${formatRupiah(pSetelahBlokir)}</td>`;
        } else {
            isiKolomPagu = `
                <td class="text-end">${formatRupiah(pDipa)}</td>
                <td class="text-end text-primary">${formatRupiah(pSetelahBlokir)}</td>`;
        }

        let badgeKewenangan = item.kewenangan === "DK" ? "badge bg-primary px-2" : "badge bg-warning text-dark px-2";
        if(item.kewenangan === "BKP") badgeKewenangan = "badge bg-info text-dark px-2";

        tr.innerHTML = `
            <td class="text-center">${index + 1}</td>
            <td class="text-center text-muted">${item.kodeSatker || '-'}</td>
            <td class="fw-semibold">${item.namaKegiatan}</td>
            <td class="text-center"><span class="${badgeKewenangan}">${item.kewenangan || '-'}</span></td>
            ${isiKolomPagu}
            <td class="text-end text-success">${formatRupiah(realRp)}</td>
            <td class="text-center fw-bold">${formatPersen(item.realisasiPersen)}</td>
            <td class="text-end fw-bold text-danger">${formatRupiah(sisa)}</td>
        `;
        tbody.appendChild(tr);

        // Tambahkan ke Total Keseluruhan
        sumTotal.paguDipa += pDipa; sumTotal.paguRev2024 += pRev24; sumTotal.paguBlokir += pBlokir; sumTotal.paguRevisi += pRevisi; sumTotal.paguSetelahBlokir += pSetelahBlokir; sumTotal.realisasiRp += realRp; sumTotal.sisa += sisa;
        
        // Pisahkan penambahan untuk DK dan TP (dan BKP ikut masuk total)
        if (item.kewenangan === "DK") {
            sumDK.paguDipa += pDipa; sumDK.paguRev2024 += pRev24; sumDK.paguBlokir += pBlokir; sumDK.paguRevisi += pRevisi; sumDK.paguSetelahBlokir += pSetelahBlokir; sumDK.realisasiRp += realRp; sumDK.sisa += sisa;
        } else if (item.kewenangan === "TP") {
            sumTP.paguDipa += pDipa; sumTP.paguRev2024 += pRev24; sumTP.paguBlokir += pBlokir; sumTP.paguRevisi += pRevisi; sumTP.paguSetelahBlokir += pSetelahBlokir; sumTP.realisasiRp += realRp; sumTP.sisa += sisa;
        }
    });

    // FUNGSI UNTUK MEMBUAT BARIS TOTAL DI BAWAH TABEL
    function buatBarisTotal(label, data, classBaris) {
        const tr = document.createElement('tr');
        tr.className = `${classBaris} fw-bold align-middle`;
        const pct = data.paguSetelahBlokir > 0 ? (data.realisasiRp / data.paguSetelahBlokir) * 100 : 0;
        
        let htmlPagu = "";
        if (tahunPilihan === "2026") {
            htmlPagu = `
                <td class="text-end">${formatRupiah(data.paguDipa)}</td>
                <td class="text-end">${formatRupiah(data.paguRevisi)}</td>
                <td class="text-end">${formatRupiah(data.paguSetelahBlokir)}</td>`;
        } else if (tahunPilihan === "2024") {
            htmlPagu = `
                <td class="text-end">${formatRupiah(data.paguDipa)}</td>
                <td class="text-end">${formatRupiah(data.paguRev2024)}</td>
                <td class="text-end">${formatRupiah(data.paguSetelahBlokir)}</td>`;
        } else if (tahunPilihan === "2025") {
            htmlPagu = `
                <td class="text-end">${formatRupiah(data.paguDipa)}</td>
                <td class="text-end">${formatRupiah(data.paguBlokir)}</td>
                <td class="text-end">${formatRupiah(data.paguSetelahBlokir)}</td>`;
        } else {
            htmlPagu = `
                <td class="text-end">${formatRupiah(data.paguDipa)}</td>
                <td class="text-end">${formatRupiah(data.paguSetelahBlokir)}</td>`;
        }

        tr.innerHTML = `
            <td colspan="4" class="text-end text-uppercase pe-3">${label}</td>
            ${htmlPagu}
            <td class="text-end">${formatRupiah(data.realisasiRp)}</td>
            <td class="text-center">${formatPersen(pct)}</td>
            <td class="text-end">${formatRupiah(data.sisa)}</td>
        `;
        return tr;
    }

    // Tampilkan 3 baris rekapitulasi
    tbody.appendChild(buatBarisTotal("Subtotal DK", sumDK, "table-light text-secondary"));
    tbody.appendChild(buatBarisTotal("Subtotal TP", sumTP, "table-light text-secondary"));
    tbody.appendChild(buatBarisTotal("Total Keseluruhan (DK + TP)", sumTotal, "table-primary text-dark border-primary fs-6"));
}

function openUnitMatrix(key) {
    if(currentModeTitle === "APBN") return;
    const unit = currentDataSource[key];
    if (!unit) return;

    document.getElementById('modalTitle').innerHTML = `<i class="fa fa-folder-open text-warning me-2"></i> Matriks [${currentModeTitle}] - ${unit.nama}`;
    const tbody = document.getElementById('matrixTableBody');
    tbody.innerHTML = ''; 

    const komponenList = [
        { label: 'Pagu Awal Tahunan', field: 'paguAwal' },
        { label: 'Pagu Anggaran / Perubahan', field: 'paguAnggaran' },
        { label: 'Pagu Efisiensi / Selisih', field: 'paguEfisiensi' },
        { label: 'Realisasi Keuangan (Rp)', field: 'realisasiKeuangan' },
        { label: 'Sisa Pagu Anggaran (Rp)', isSisaPagu: true }, 
        { label: 'Persentase Keuangan (%)', field: 'realisasiPersen', isPercent: true },
        { label: 'Realisasi Fisik (%)', field: 'realisasiFisik', isPercent: true }
    ];
    const tahunList = ['2022', '2023', '2024', '2025', '2026'];

    komponenList.forEach(komponen => {
        const tr = document.createElement('tr');
        const labelClass = komponen.isSisaPagu ? 'text-start fw-bold bg-warning bg-opacity-25' : 'text-start fw-semibold bg-light';
        const tdLabel = document.createElement('td');
        
        tdLabel.textContent = komponen.label;
        tdLabel.className = labelClass;
        tr.appendChild(tdLabel);

        let totalNilai = 0;
        let jumlahTahunData = 0;

        tahunList.forEach(tahun => {
            const tdTahun = document.createElement('td');
            let nilai = 0;
            
            if (komponen.isSisaPagu) {
                const pagu = (unit[tahun] && unit[tahun]['paguAnggaran']) ? unit[tahun]['paguAnggaran'] : 0;
                const realisasi = (unit[tahun] && unit[tahun]['realisasiKeuangan']) ? unit[tahun]['realisasiKeuangan'] : 0;
                nilai = pagu > 0 ? (pagu - realisasi) : 0;
                tdTahun.className = 'text-end fw-bold text-danger'; 
            } else {
                nilai = (unit[tahun] && unit[tahun][komponen.field]) ? unit[tahun][komponen.field] : 0;
                tdTahun.className = 'text-end';
            }
            
            tdTahun.textContent = komponen.isPercent ? formatPersen(nilai) : formatRupiah(nilai);
            tr.appendChild(tdTahun);

            totalNilai += nilai;
            if (nilai > 0) jumlahTahunData++;
        });

        const tdTotal = document.createElement('td');
        tdTotal.className = 'text-end fw-bold table-primary text-dark';
        
        if (komponen.isPercent) {
            const rataRata = jumlahTahunData > 0 ? (totalNilai / jumlahTahunData) : 0;
            tdTotal.textContent = formatPersen(rataRata);
        } else {
            tdTotal.textContent = formatRupiah(totalNilai);
        }
        tr.appendChild(tdTotal);
        tbody.appendChild(tr);
    });

    const matrixModal = new bootstrap.Modal(document.getElementById('matrixModal'));
    matrixModal.show();
}

function formatRupiah(angka) {
    if (angka === 0 || !angka) return 'Rp 0';
    const isNegative = angka < 0;
    const formatted = Math.abs(angka).toLocaleString('id-ID');
    // Format biar minusnya di depan Rp kayak di Excel
    return (isNegative ? '- Rp ' : 'Rp ') + formatted;
}

function formatPersen(angka) {
    if (angka === 0 || !angka) return '0%';
    return angka.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + '%';
}

window.onload = function() {
    showTabAPBD(); 
};
</script>
</body>
</html>
