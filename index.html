<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Anggaran - DISPANTPH Kaltim</title>
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-dark: #072a19;
            --primary-emerald: #1b5e20;
            --emerald-bright: #2e7d32;
            --emerald-light: #4caf50;
            --accent-gold: #fbc02d;
            --accent-green: #81c784;
            --glass-bg: rgba(255, 255, 255, 0.94);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, #1e5c33 0%, #0c381e 50%, #051d10 100%);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
        }

        /* Animated Background Orbs & Leaves */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: floatShape 12s infinite alternate ease-in-out;
            opacity: 0.55;
        }

        .shape-1 {
            width: 450px;
            height: 450px;
            background: #2e7d32;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: #fbc02d;
            bottom: -120px;
            right: -80px;
            animation-delay: -6s;
            opacity: 0.25;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: #4caf50;
            top: 40%;
            right: 15%;
            animation-delay: -3s;
            opacity: 0.35;
        }

        @keyframes floatShape {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(40px, 50px) scale(1.1);
            }
        }

        /* Background Pattern SVG Overlay */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container Card */
        .portal-card {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(46, 125, 50, 0.2);
            max-width: 460px;
            width: 100%;
            padding: 44px 38px;
            text-align: center;
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Brand Logo Container */
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(46, 125, 50, 0.1);
            border: 1px solid rgba(46, 125, 50, 0.25);
            color: var(--primary-emerald);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .icon-hero-wrapper {
            position: relative;
            width: 95px;
            height: 95px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-hero-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            border-radius: 26px;
            transform: rotate(-6deg);
            box-shadow: 0 10px 25px rgba(27, 94, 32, 0.35);
            transition: all 0.4s ease;
        }

        .portal-card:hover .icon-hero-bg {
            transform: rotate(0deg) scale(1.05);
        }

        .icon-hero-inner {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Title & Typography */
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #1a2e22;
            font-size: 1.75rem;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            line-height: 1.25;
        }

        .subtitle {
            color: #526358;
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.55;
            margin-bottom: 28px;
        }

        .subtitle strong {
            color: #1b5e20;
        }

        /* Feature Pills */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .feature-pill {
            background: #f3f8f4;
            border: 1px solid #e1efe4;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #2c4a35;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            transition: all 0.25s ease;
        }

        .feature-pill:hover {
            background: #e8f5e9;
            border-color: #a5d6a7;
            transform: translateY(-2px);
        }

        .feature-pill i {
            font-size: 1.1rem;
            color: #2e7d32;
        }

        /* Info Badge Direct Access */
        .info-access-box {
            background: linear-gradient(135deg, rgba(251, 192, 45, 0.12) 0%, rgba(76, 175, 80, 0.08) 100%);
            border: 1px dashed rgba(46, 125, 50, 0.3);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.88rem;
            color: #1b5e20;
            font-weight: 600;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Button Enter */
        .btn-enter {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 16px 24px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.3px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 12px 25px rgba(27, 94, 32, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .btn-enter:hover::before {
            left: 100%;
        }

        .btn-enter:hover {
            background: linear-gradient(135deg, #388e3c 0%, #2e7d32 100%);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 16px 32px rgba(27, 94, 32, 0.5);
            color: #ffffff;
        }

        .btn-enter:active {
            transform: translateY(-1px) scale(0.99);
        }

        .btn-enter i {
            transition: transform 0.3s ease;
        }

        .btn-enter:hover i {
            transform: translateX(6px);
        }

        /* Footer Tagline */
        .portal-footer {
            margin-top: 26px;
            font-size: 0.78rem;
            color: #78909c;
            font-weight: 500;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <!-- Background Orbs -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="bg-pattern"></div>

    <!-- Portal Login Card -->
    <div class="portal-card">

        <div class="brand-badge">
            <i class="fa-solid fa-leaf"></i> DISPANTPH KALTIM
        </div>

        <div class="icon-hero-wrapper">
            <div class="icon-hero-bg"></div>
            <div class="icon-hero-inner">
                <i class="fa-solid fa-wheat-awn"></i>
            </div>
        </div>

        <h1 class="title">Sistem Informasi Anggaran</h1>
        <p class="subtitle">
            Dinas Pangan, Tanaman Pangan,dan Hortikultura <br>
            <strong>Provinsi Kalimantan Timur</strong>
        </p>

        <!-- Feature Pills Grid -->
        <div class="feature-grid">
            <div class="feature-pill">
                <i class="fa-solid fa-seedling"></i>
                <span>Tanaman Pangan</span>
            </div>
            <div class="feature-pill">
                <i class="fa-solid fa-apple-whole"></i>
                <span>Hortikultura</span>
            </div>
            <div class="feature-pill">
                <i class="fa-solid fa-landmark"></i>
                <span>APBD & APBN</span>
            </div>
            <div class="feature-pill">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Realisasi Pagu</span>
            </div>
        </div>

        <!-- Info Direct Access -->
        <div class="info-access-box">
            <i class="fa-solid fa-shield-halved text-success"></i>
            <span>Akses Publik Direct & Tanpa Login</span>
        </div>

        <!-- Action Button -->
        <a href="dashboard.html" style="text-decoration: none;">
            <button class="btn-enter">
                <span>Mulai</span>
                <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </a>

        <!-- Footer -->
        <div class="portal-footer">
            &copy; 2026 Dinas Pangan, Tanaman Pangan dan Hortikultura<br>
            Provinsi Kalimantan Timur
        </div>

    </div>

</body>

</html>
