<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Anggaran - DPTPH Kaltim</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            /* PERHATIAN: Ganti URL di bawah ini dengan link gambar dari website DPTPH Kaltim atau nama file foto lokal Anda */
            background: linear-gradient(rgba(20, 60, 20, 0.75), rgba(10, 40, 10, 0.85)), 
                        url('https://images.unsplash.com/photo-1592982537447-6f2334208f34?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        
        .login-wrapper {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #2e7d32;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-instansi {
            /* PERHATIAN: Ganti URL ini dengan link logo Kaltim dari website DPTPH */
            width: 80px; 
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .title { 
            font-weight: 800; 
            color: #1a4d2e; /* Hijau gelap khas dinas */
            font-size: 1.6rem; 
            margin-bottom: 5px; 
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .subtitle { 
            color: #495057; 
            font-size: 0.95rem; 
            font-weight: 500;
            margin-bottom: 35px; 
            line-height: 1.4; 
        }

        .info-box {
            background: #e8f5e9; /* Hijau sangat muda */
            border: 1px dashed #4caf50;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 0.9rem;
            color: #2e7d32;
            font-weight: 600;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-masuk {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 1.05rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-masuk:hover {
            background: #1b5e20;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.4);
            color: white;
        }
        
        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Logo Instansi -->
            <!-- Jika Anda sudah download logo kaltim, ganti src dengan nama filenya, misal: src="logo-kaltim.png" -->
            <img src="https://www.kaltimprov.go.id/lambang" alt="Logo Kaltim" class="logo-instansi">
            
            <h1 class="title">Sistem Informasi Anggaran</h1>
            <p class="subtitle">Dinas Pangan, Tanaman Pangan & Hortikultura<br>Provinsi Kalimantan Timur</p>
            
            <div class="info-box">
                <i class="fa-solid fa-unlock-keyhole"></i>
                <span>Akses Publik (Tanpa Login)</span>
            </div>

            <a href="dashboard.html" style="text-decoration: none;">
                <button class="btn-masuk">
                    Masuk ke Dasbor <i class="fa-solid fa-arrow-right"></i>
                </button>
            </a>
            
            <div class="footer-text">
                &copy; 2026 DPTPH Provinsi Kalimantan Timur
            </div>
        </div>
    </div>

</body>
</html>
