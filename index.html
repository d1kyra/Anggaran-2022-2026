<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Anggaran</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            /* Background gradien hijau elegan (Tema Pertanian/Pangan) */
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            padding: 45px 35px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-container {
            width: 85px;
            height: 85px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.15);
        }
        .title { 
            font-weight: 800; 
            color: #2c3e50; 
            font-size: 1.5rem; 
            margin-bottom: 8px; 
            letter-spacing: -0.5px;
        }
        .subtitle { 
            color: #6c757d; 
            font-size: 0.95rem; 
            margin-bottom: 30px; 
            line-height: 1.5; 
        }
        .info-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 0.9rem;
            color: #495057;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-masuk {
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-masuk:hover {
            background: #1b5e20;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.4);
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-container">
            <!-- Menggunakan ikon brankas/chart agar relevan dengan anggaran -->
            <i class="fa-solid fa-vault"></i> 
        </div>
        
        <h1 class="title">Sistem Informasi Anggaran</h1>
        <p class="subtitle">Dinas Pangan, Tanaman Pangan & Hortikultura</p>
        
        <div class="info-box">
            <i class="fa-solid fa-circle-info text-primary"></i>
            <span>Masuk tanpa harus login</span>
        </div>

        <!-- Tombol ini langsung diarahkan ke dashboard.html -->
        <a href="dashboard.html" style="text-decoration: none;">
            <button class="btn-masuk">
                Masuk ke Sistem <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </a>
    </div>

</body>
</html>
