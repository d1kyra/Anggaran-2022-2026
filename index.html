<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - APBD + APBN 2022-2026</title>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #14e040 0%, #14e040 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        .login-header i {
            font-size: 3rem;
            color: #1e3c72;
        }
        .btn-login {
            background: #000000;
            color: white;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #2a5298;
            color: white;
            transform: translateY(-2px);
        }
        /* Kotak info penanda Bypass */
        .bypass-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #495057;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="login-header mb-4">
        <i class="fa-solid fa-vault mb-2"></i>
        <h4 class="fw-bold text-dark">Sistem Informasi Anggaran</h4>
        <small class="text-muted">Dinas Pangan, Tanaman Pangan & Hortikultura</small>
    </div>

    <!-- Info Mode Bypass sebagai pengganti kolom input -->
    <div class="bypass-box">
        <i class="fa-solid fa-circle-info text-primary"></i>
        <span>Masuk tanpa harus login</span>
    </div>

    <!-- Tombol yang pas diklik langsung lari ke dashboard.html -->
    <button onclick="window.location.href='dashboard.html'" class="btn btn-login w-100 py-2 fw-semibold">
        Masuk ke Sistem <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
    </button>
</div>

</body>
</html>
